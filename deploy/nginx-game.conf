# Add inside the existing HTTPS server { ... } block for the domain (nginx).
# Serves the app at https://<domain>/game/ ; the app listens on 127.0.0.1:3100 with BASE_PATH=/game.
location = /game { return 301 /game/; }
location /game/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 8m;      # photo uploads (5 MB limit + base64)
    proxy_read_timeout 300s;      # music generation can take a few minutes
}

# World Agent Pass uses the registered callback https://<domain>/api/auth/world/callback.
# Keep this narrow root-level route while the app itself is served at /game/.
location /api/auth/world/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
